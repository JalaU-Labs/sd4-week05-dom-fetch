workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - verify
  - e2e
  - deploy

default:
  image: node:20-bookworm
  before_script:
    - corepack enable
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"

variables:
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

verify:
  stage: verify
  script:
    - pnpm install --frozen-lockfile
    - pnpm run lint
    - pnpm run format:check
    - pnpm run typecheck
    - pnpm run test
    - pnpm run build
  artifacts:
    name: "web-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist
    expire_in: 1 week

e2e:
  stage: e2e
  needs:
    - verify
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec playwright install --with-deps chromium
    - pnpm run test:e2e
  artifacts:
    when: always
    name: "playwright-report-$CI_COMMIT_SHORT_SHA"
    paths:
      - playwright-report
      - test-results
    expire_in: 1 week

pages:
  stage: deploy
  needs:
    - job: verify
      artifacts: true
    - job: e2e
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p public
    - cp -r dist/. public/
  artifacts:
    paths:
      - public
  pages:
    publish: public
